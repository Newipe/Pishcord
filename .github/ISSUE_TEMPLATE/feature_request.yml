name: Pishcord Feature Request
description: Suggest a new feature or capability for Pishcord.
title: "[Feature] "
labels: ["type: feature"]
body:
    - type: markdown
      attributes:
          value: |
              ## Pishcord feature requests

              Use this form to propose **new functionality for Pishcord itself**, such as changes to DoH, resolver handling, connection profiles, networking, privacy, performance, configuration, or the application experience.

              This tracker is **not** for:
              - Plugin requests for Vencord — those belong to the plugin or Vencord project
              - Features of upstream Vesktop that Pishcord does not modify
              - Discord client features or account/server requests
              - Support questions

              Describe the problem you want to solve, not only the implementation you have in mind. That makes it easier to evaluate alternatives and edge cases.

    - type: dropdown
      id: feature-category
      attributes:
          label: Feature category
          description: Which area of Pishcord does this request relate to?
          options:
              - DoH and DNS
              - Connection Profiles
              - Networking
              - Privacy and Security
              - User Interface and Experience
              - Performance
              - Configuration
              - Installation and Updates
              - Other Pishcord features
      validations:
          required: true

    - type: textarea
      id: problem-use-case
      attributes:
          label: Problem or use case
          description: What problem are you trying to solve? Describe your setup, network, or workflow and why the current behavior is not enough.
          placeholder: On my network, I need to ... but Pishcord currently ...
      validations:
          required: true

    - type: textarea
      id: proposed-solution
      attributes:
          label: Proposed solution
          description: What would you like Pishcord to do? A rough idea is fine; it does not have to be a complete implementation plan.
      validations:
          required: true

    - type: textarea
      id: why-useful
      attributes:
          label: Why this would be useful
          description: Who would benefit, and in which situations? Explain the practical value rather than only the feature itself.
      validations:
          required: true

    - type: textarea
      id: expected-behavior
      attributes:
          label: How the feature should behave
          description: Describe the expected user experience, settings, defaults, and any important edge cases.
      validations:
          required: true

    - type: textarea
      id: additional-context
      attributes:
          label: Additional context (optional)
          description: Screenshots, mockups, examples from other tools, related issues, or technical notes.
      validations:
          required: false

    - type: checkboxes
      id: confirmations
      attributes:
          label: Before submitting
          options:
              - label: I searched existing issues and this has not already been requested.
                required: true
              - label: This request is for Pishcord-specific functionality, not an upstream Vesktop or Vencord plugin feature.
                required: true
              - label: I described the problem or use case, not only a requested implementation.
                required: true
              - label: I understand this tracker is not a support channel.
                required: true
